[project]
name = "mini-agent"
version = "0.1.0"
description = "A barebones Python agent project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.1.1",
    "loguru>=0.7.3",
    "mistralai==2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
src = ["src"]
