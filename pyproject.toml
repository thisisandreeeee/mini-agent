[project]
name = "mini-agent"
version = "0.1.0"
description = "A barebones Python agent project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "mistralai==2.6.0",
]

[dependency-groups]
dev = [
    "deepeval>=4.1.1,<5",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm_eval: live LLM evaluation; requires MISTRAL_API_KEY and incurs API cost",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
src = ["src"]
